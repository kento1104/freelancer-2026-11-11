<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freelancer Project Forwarder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Freelancer Projects</h1>
      <p class="destination" id="destination"></p>
      <button id="send-button" type="button">Fetch and send</button>
      <div class="repeat-controls">
        <button id="start-button" type="button">Start server auto-fetch</button>
        <button id="stop-button" type="button" disabled>Stop</button>
      </div>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <section id="results" aria-label="Fetched project data" hidden>
        <h2>Fetched projects <span id="project-count"></span></h2>
        <div class="table-container" role="region" aria-label="Project data table" tabindex="0">
          <table>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="server-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
